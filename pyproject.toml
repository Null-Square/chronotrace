[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronotrace"
version = "0.1.0"
description = "Training-history forensics for language models"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "NullSquare" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
chronotrace = "chronotrace.cli:main"

[project.optional-dependencies]
dev = [
  "numpy>=2.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "scipy>=1.13",
]
mvp = [
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "torch>=2.4",
  "transformers>=4.45",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chronotrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/chronotrace/geometry/local_order_hierarchy.py" = ["I001"]
"src/chronotrace/geometry/order_affine.py" = ["I001"]
"src/chronotrace/geometry/projected_interactions.py" = ["I001"]
"scripts/pythia_14m_four_stage_confirmation.py" = ["E501"]
"scripts/pythia_14m_counterfactual_response_pilot.py" = ["E501", "I001"]
"scripts/pythia_14m_k3_affine_last_stage_diagnostic.py" = ["F821"]
"scripts/pythia_14m_k3_convex_last_stage_diagnostic.py" = ["F821"]
"scripts/pythia_14m_local_commutator_pilot.py" = ["E501", "I001"]
"scripts/pythia_14m_reverse_peeling_all24.py" = ["E501"]
"scripts/pythia_14m_reverse_peeling_armijo_diagnostic.py" = ["E501"]
