<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="360" viewBox="0 0 1450 360" role="img" aria-labelledby="title desc">
<title id="title">ChronoTrace certificate pipeline</title>
<desc id="desc">Known training inputs and a hidden chronology produce final weights. ChronoTrace freezes low-degree geometry and witnesses, then issues label-blind two-sided precedence certificates that may abstain.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3159c8"/></marker></defs>
<style>
 text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #172033; }
 .title { font-size: 31px; font-weight: 750; } .subtitle { font-size: 17px; fill: #526070; }
 .box { fill: #f7f9fc; stroke: #cad3e0; stroke-width: 1.5; } .boxtitle { font-size: 17px; font-weight: 700; }
 .body { font-family: Inter, ui-sans-serif, system-ui; font-size: 14px; line-height: 1.25; color: #526070; }
 .arrow { stroke: #3159c8; stroke-width: 3; fill: none; } .tag { font-size: 15px; font-weight: 650; fill: #3159c8; }
</style>
<rect width="1450" height="360" rx="24" fill="#ffffff"/>
<text x="50" y="55" class="title">Certified inverse reconstruction of training chronology</text>
<text x="50" y="86" class="subtitle">The chronology is hidden from the decision rule; the method certifies precedence claims or abstains.</text>
<rect x="50" y="118" width="190" height="126" rx="16" class="box"/><text x="68" y="158" class="boxtitle">Known inputs</text><foreignObject x="68" y="172" width="156" height="60"><div xmlns="http://www.w3.org/1999/xhtml" class="body">base checkpoint · candidate stages · training rule</div></foreignObject><rect x="285" y="118" width="190" height="126" rx="16" class="box"/><text x="303" y="158" class="boxtitle">Hidden variable</text><foreignObject x="303" y="172" width="156" height="60"><div xmlns="http://www.w3.org/1999/xhtml" class="body">unknown stage chronology</div></foreignObject><rect x="520" y="118" width="190" height="126" rx="16" class="box"/><text x="538" y="158" class="boxtitle">Observed endpoint</text><foreignObject x="538" y="172" width="156" height="60"><div xmlns="http://www.w3.org/1999/xhtml" class="body">final model weights</div></foreignObject><rect x="755" y="118" width="190" height="126" rx="16" class="box"/><text x="773" y="158" class="boxtitle">Frozen geometry</text><foreignObject x="773" y="172" width="156" height="60"><div xmlns="http://www.w3.org/1999/xhtml" class="body">ordered interactions · witness bank</div></foreignObject><rect x="990" y="118" width="190" height="126" rx="16" class="box"/><text x="1008" y="158" class="boxtitle">Two-sided certificates</text><foreignObject x="1008" y="172" width="156" height="60"><div xmlns="http://www.w3.org/1999/xhtml" class="body">test i&lt;j and j&lt;i independently</div></foreignObject><rect x="1225" y="118" width="190" height="126" rx="16" class="box"/><text x="1243" y="158" class="boxtitle">Output</text><foreignObject x="1243" y="172" width="156" height="60"><div xmlns="http://www.w3.org/1999/xhtml" class="body">precedence graph · total order or abstain</div></foreignObject><path d="M240 181 H280" class="arrow" marker-end="url(#arrow)"/><path d="M475 181 H515" class="arrow" marker-end="url(#arrow)"/><path d="M710 181 H750" class="arrow" marker-end="url(#arrow)"/><path d="M945 181 H985" class="arrow" marker-end="url(#arrow)"/><path d="M1180 181 H1220" class="arrow" marker-end="url(#arrow)"/>
<text x="767" y="282" class="tag">witnesses frozen before higher-order candidate output</text>
<text x="1004" y="312" class="tag">label-blind decision</text>
</svg>
