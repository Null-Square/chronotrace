name: Pythia 14M four-stage FP64 LR calibration

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/pythia-finite-pair-scale
    paths:
      - configs/pythia_14m_four_stage_fp64_lr.launch

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  ATEN_CPU_CAPABILITY: default
  MKL_CBWR: COMPATIBLE
  MKL_DYNAMIC: "FALSE"
  OMP_DYNAMIC: "FALSE"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"

concurrency:
  group: pythia-14m-four-stage-fp64-lr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install pinned CPU PyTorch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch==2.13.0+cpu"
      - name: Install pinned scale stack
        run: >-
          python -m pip install
          "transformers==5.16.1"
          "tokenizers==0.23.1"
          "huggingface-hub==1.29.0"
          "safetensors==0.8.0"
      - name: Install ChronoTrace
        run: python -m pip install -e ".[mvp]"
      - name: Run frozen chronology-blind FP64 singleton calibration
        run: >-
          python scripts/pythia_14m_four_stage_fp64_lr.py
          --protocol configs/pythia_14m_four_stage_fp64_lr.lock.json
          --output pythia-14m-four-stage-fp64-lr.json
          --threads 1
      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pythia-14m-four-stage-fp64-lr
          path: pythia-14m-four-stage-fp64-lr.json
          if-no-files-found: error
