name: Pythia 14M theory diagnostic

on:
  workflow_dispatch:

concurrency:
  group: pythia-14m-theory-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  ATEN_CPU_CAPABILITY: default
  MKL_CBWR: COMPATIBLE
  MKL_DYNAMIC: "FALSE"
  OMP_DYNAMIC: "FALSE"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  theory-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install pinned CPU PyTorch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch==2.13.0+cpu"
      - name: Install pinned scale stack
        run: >-
          python -m pip install
          "transformers==5.16.1"
          "tokenizers==0.23.1"
          "huggingface-hub==1.29.0"
          "safetensors==0.8.0"
      - name: Install ChronoTrace
        run: python -m pip install -e ".[mvp]"
      - name: Run frozen state-conditioned diagnostic
        run: >-
          python scripts/pythia_14m_theory_diagnostic.py
          --lock configs/pythia_scale.lock.json
          --output pythia-14m-theory-diagnostic.json
          --threads 1
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pythia-14m-theory-diagnostic
          path: pythia-14m-theory-diagnostic.json
          if-no-files-found: error
