name: Paper

on:
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  push:
    branches:
      - experiment/pythia-finite-pair-scale
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            texlive-pictures
      - name: Compile manuscript
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Fail on unresolved citations or references
        working-directory: paper
        run: |
          if grep -E "Citation .* undefined|Reference .* undefined|There were undefined references|There were undefined citations" main.log; then
            echo "Unresolved citation/reference found"
            exit 1
          fi
      - name: Report layout warnings
        working-directory: paper
        run: |
          grep -E "Overfull \\hbox|Underfull \\hbox|LaTeX Warning:|Package .* Warning:" main.log || true
      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: chronotrace-paper
          path: paper/main.pdf
          if-no-files-found: error
