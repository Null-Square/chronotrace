name: Paper

on:
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  push:
    branches: [main, "publication/**"]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra \
            texlive-pictures texlive-publishers
      - name: Compile current manuscript and check references/layout
        run: make -C paper check
      - name: Upload current manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: chronotrace-paper
          path: paper/main.pdf
          if-no-files-found: error
