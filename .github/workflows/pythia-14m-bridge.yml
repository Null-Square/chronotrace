name: Pythia 14M reproducibility gate

on:
  push:
    branches: [experiment/pythia-finite-pair-scale]
    paths:
      - .github/workflows/pythia-14m-bridge.yml

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  replica:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHRONOTRACE_REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install pinned CPU PyTorch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch==2.13.0+cpu"
      - name: Install pinned scale stack
        run: >-
          python -m pip install
          "transformers==5.16.1"
          "tokenizers==0.23.1"
          "huggingface-hub==1.29.0"
          "safetensors==0.8.0"
      - name: Install ChronoTrace
        run: python -m pip install -e ".[mvp]"
      - name: Run frozen 14M chronology replica
        run: >-
          python scripts/pythia_finite_pair_bridge.py
          --lock configs/pythia_scale.lock.json
          --output pythia-14m-bridge.json
          --threads 1
      - name: Upload replica evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pythia-14m-replica-${{ matrix.replica }}
          path: pythia-14m-bridge.json
          if-no-files-found: warn

  compare-replicas:
    needs: replica
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.16"
      - name: Download all replica evidence
        uses: actions/download-artifact@v4
        with:
          pattern: pythia-14m-replica-*
          path: replicas
      - name: Require exact numerical agreement
        run: >-
          python scripts/compare_pythia_14m_replicas.py
          --root replicas
          --output pythia-14m-reproducibility.json
          --expected-replicas 3
      - name: Upload reproducibility verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pythia-14m-reproducibility-verdict
          path: pythia-14m-reproducibility.json
          if-no-files-found: warn
