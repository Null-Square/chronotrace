name: Aggregate archived Pythia 14M T2b artifacts

on:
  workflow_dispatch:

concurrency:
  group: pythia-14m-t2b-aggregate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.16"
      - name: Install ChronoTrace
        run: python -m pip install -e .
      - name: Download exact completed T2b slice artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: pythia-14m-t2b-*
          path: t2b-slices
          merge-multiple: true
          run-id: 33248443650
          github-token: ${{ github.token }}
      - name: Aggregate frozen evidence without selection
        run: >-
          python scripts/aggregate_pythia_14m_t2b_lr.py
          --protocol configs/pythia_14m_t2b_lr.lock.json
          --input-dir t2b-slices
          --output pythia-14m-t2b-aggregate.json
      - name: Hash aggregate
        run: sha256sum pythia-14m-t2b-aggregate.json
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: pythia-14m-t2b-aggregate-existing
          path: pythia-14m-t2b-aggregate.json
          if-no-files-found: error
