name: Pythia 14M four-stage FP64 K2 K3 pilot

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/pythia-finite-pair-scale
    paths:
      - configs/pythia_14m_four_stage_k23_pilot.launch

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  ATEN_CPU_CAPABILITY: default
  MKL_CBWR: COMPATIBLE
  MKL_DYNAMIC: "FALSE"
  OMP_DYNAMIC: "FALSE"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"

concurrency:
  group: pythia-14m-four-stage-k23-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - name: Stop superseded pilot without model execution
        run: |
          if grep -qx 'cancel_only=true' configs/pythia_14m_four_stage_k23_pilot.launch; then
            echo 'Cancel-only marker present; no tokenizer or model execution.'
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install pinned CPU PyTorch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch==2.13.0+cpu"
      - name: Install pinned scale stack
        run: >-
          python -m pip install
          "transformers==5.16.1"
          "tokenizers==0.23.1"
          "huggingface-hub==1.29.0"
          "safetensors==0.8.0"
      - name: Install ChronoTrace
        run: python -m pip install -e ".[mvp]"
      - name: Run frozen non-confirmatory K2 K3 pilot
        run: >-
          python scripts/pythia_14m_four_stage_k23_pilot.py
          --protocol configs/pythia_14m_four_stage_k23_pilot.lock.json
          --output pythia-14m-four-stage-k23-pilot.json
          --threads 1
      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pythia-14m-four-stage-k23-pilot
          path: pythia-14m-four-stage-k23-pilot.json
          if-no-files-found: error
