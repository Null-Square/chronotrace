name: Structured chronology validation

on:
  push:
    branches: [research/structured-short-probe-certificates-20260912]
    paths:
      - "src/chronotrace/validated_affine.py"
      - "scripts/structured_affine_benchmark*.py"
      - "tests/test_validated_affine.py"
      - "tests/test_structured_benchmark.py"
      - "tests/test_history_blind_target.py"
      - "tests/test_short_probe_boundary.py"
      - "configs/structured_chronotrace_confirmation_v2.json"
      - ".github/workflows/structured-chronology-validation.yml"
  pull_request:
    paths:
      - "src/chronotrace/validated_affine.py"
      - "scripts/structured_affine_benchmark*.py"
      - "tests/test_validated_affine.py"
      - "tests/test_structured_benchmark.py"
      - "tests/test_history_blind_target.py"
      - "tests/test_short_probe_boundary.py"
      - "configs/structured_chronotrace_confirmation_v2.json"
      - ".github/workflows/structured-chronology-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structured-chronology-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression-and-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: python -m pip install -e ".[dev]" "scikit-learn>=1.5"
      - name: Check frozen source hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          config = json.loads(Path('configs/structured_chronotrace_confirmation_v2.json').read_text())
          for name, expected in config['source_sha256'].items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Frozen source hash mismatch: {name}')
          PY
      - name: Static correctness checks without rewriting frozen source
        run: >-
          ruff check --select F,E9
          src/chronotrace/validated_affine.py
          scripts/structured_affine_benchmark.py
          scripts/structured_affine_benchmark_v2.py
          tests/test_validated_affine.py
          tests/test_structured_benchmark.py
          tests/test_history_blind_target.py
          tests/test_short_probe_boundary.py
      - name: Full repository regression
        run: python -m pytest --junitxml=artifacts/structured-full-tests.xml
      - name: Full repository optimized-mode regression
        env:
          PYTHONOPTIMIZE: "1"
        run: python -m pytest --junitxml=artifacts/structured-optimized-tests.xml
      - name: Reexecute frozen v2 512-case confirmation without model downloads
        run: >-
          python scripts/structured_affine_benchmark_v2.py
          --protocol configs/structured_chronotrace_confirmation_v2.json
          --output artifacts/structured-confirmation-v2-ci.json
      - name: Retain complete results and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structured-chronology-validation-${{ github.run_id }}
          path: artifacts/structured-*
          if-no-files-found: warn
