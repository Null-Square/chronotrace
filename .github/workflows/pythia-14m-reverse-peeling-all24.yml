name: Pythia 14M reverse peeling all24

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/pythia-finite-pair-scale
    paths:
      - configs/pythia_14m_reverse_peeling_all24.launch

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  ATEN_CPU_CAPABILITY: default
  MKL_CBWR: COMPATIBLE
  MKL_DYNAMIC: "FALSE"
  OMP_DYNAMIC: "FALSE"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"

concurrency:
  group: pythia-14m-reverse-peeling-all24-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reverse-peeling-all24:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install pinned CPU PyTorch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch==2.13.0+cpu"
      - name: Install pinned scale stack
        run: >-
          python -m pip install
          "transformers==5.16.1"
          "tokenizers==0.23.1"
          "huggingface-hub==1.29.0"
          "safetensors==0.8.0"
      - name: Install ChronoTrace
        run: python -m pip install -e ".[mvp]"
      - name: Run frozen all-24 reverse peeling adjudication
        run: >-
          python scripts/pythia_14m_reverse_peeling_all24.py
          --protocol configs/pythia_14m_reverse_peeling_all24.lock.json
          --interpretation configs/pythia_14m_reverse_peeling_all24_interpretation.lock.json
          --k23-protocol configs/pythia_14m_four_stage_k23_pilot.lock.json
          --replay-lock configs/pythia_14m_four_stage_k23_pilot_replay.lock.json
          --smoke-selection configs/pythia_14m_reverse_peeling_smoke.selection.json
          --output pythia-14m-reverse-peeling-all24.json
          --threads 1
      - name: Upload all-24 reverse peeling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pythia-14m-reverse-peeling-all24
          path: pythia-14m-reverse-peeling-all24.json
          if-no-files-found: error
