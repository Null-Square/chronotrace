name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "paper/**"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "paper/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit and drift tests
        run: pytest

  mvp-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
      - name: Install MVP and test stack
        run: python -m pip install -e ".[mvp,dev]"
      - name: Torch geometry and masking regressions
        run: >-
          pytest tests/test_feature_masking.py
          tests/test_commutator_geometry.py
          tests/test_operator_geometry.py
          tests/test_secant_geometry.py
          tests/test_history_geometry.py
          tests/test_affine_geometry.py
      - name: Inverse commutator theorem smoke
        run: python scripts/commutator_smoke.py
      - name: Tiny transformer commutator smoke
        run: python scripts/transformer_commutator_smoke.py
      - name: Multi-update macro-operator smoke
        run: python scripts/operator_commutator_smoke.py
      - name: Finite-pair chronology stress test
        run: python scripts/finite_pair_commutator_smoke.py
      - name: End-to-end CPU smoke
        run: python scripts/smoke_mvp.py
